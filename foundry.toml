[profile.default]
src = "contracts"
out = "artifacts-forge"
libs = ["node_modules", "lib", "dependencies"]
test = "test-forge"
cache_path = 'cache-forge'
evm_version = 'cancun'
fs_permissions = [
    { access = "read", path = "./artifacts-forge/"},
    { access = "read", path = "./deployment/chain-config/"},
    { access = "read", path = "./deployment/cuts/"},
    { access = "read-write", path = "./deployment/deploys/"},
    { access = "read-write", path = "./deployment/output-internal/"},
    { access = "read", path = "./node_modules/@gnosis.pm/safe-contracts/build/artifacts/"}
]
optimizer = true
optimizer_runs = 200
# viaIR enabled globally (needed to keep TeePaymentsUtxo under the contract size limit). Tests read
# block.timestamp/number via vm.getBlockTimestamp()/vm.getBlockNumber() so viaIR's constant-folding of
# those reads across vm.warp/vm.roll does not return stale values. RNat/P256/NodePossession/mocks are
# pinned to viaIR off below (Yul stack/unimplemented issues).
via_ir = true
ffi = true
# Reference Yul IR artifacts (e.g. test-forge/fv/lean/relay_ir_optimized.yul) are kept for the
# formal-verification work but are NOT contracts to compile. Skip them so `forge build` ignores them.
skip = ['*.yul']

[[profile.default.additional_compiler_profiles]]
name = "no-via-ir"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNat.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNatAccount.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.6.1/utils/cryptography/P256.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/*.sol"
via_ir = false

[invariant]
runs = 128
depth = 128
fail_on_revert = true

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.6.1"
flare-periphery = "0.1.38"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
flare = "${FLARE_RPC}"
songbird = "${SONGBIRD_RPC}"
coston2 = "${COSTON2_RPC}"
coston = "${COSTON2_RPC}"
staging = "${STAGING_RPC}"

[profile.coverage]
# forge coverage disables the optimizer + viaIR globally for accurate line coverage, but a few contracts
# only compile with viaIR (stack too deep otherwise): the TeePayments contracts, OZ's P256 library and
# NodePossessionVerifier (which imports it). Pin just those back to viaIR so coverage can build (same as
# the Hardhat config); every other contract keeps the accurate non-viaIR instrumentation.
[[profile.coverage.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePayments.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePaymentsUtxo.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.6.1/utils/cryptography/P256.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = true

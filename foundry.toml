[profile.default]
src = "contracts"
out = "artifacts-forge"
libs = ["node_modules", "lib", "dependencies"]
test = "test-forge"
cache_path = 'cache-forge'
evm_version = 'cancun'
fs_permissions = [
    { access = "read", path = "./artifacts-forge/"},
    { access = "read", path = "./deployment/chain-config/"},
    { access = "read", path = "./deployment/cuts/"},
    { access = "read-write", path = "./deployment/deploys/"},
    { access = "read-write", path = "./deployment/output-internal/"}
]
optimizer = true
optimizer_runs = 200
# viaIR enabled globally (needed to keep TeePaymentsUtxo under the contract size limit). Tests read
# block.timestamp/number via vm.getBlockTimestamp()/vm.getBlockNumber() so viaIR's constant-folding of
# those reads across vm.warp/vm.roll does not return stale values. RNat/P256/NodePossession/mocks are
# pinned to viaIR off below (Yul stack/unimplemented issues).
via_ir = true
ffi = true

[[profile.default.additional_compiler_profiles]]
name = "no-via-ir"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNat.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNatAccount.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.6.1/utils/cryptography/P256.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/*.sol"
via_ir = false

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.6.1"
flare-periphery = "0.1.38"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
flare = "${FLARE_RPC}"
songbird = "${SONGBIRD_RPC}"
coston2 = "${COSTON2_RPC}"
coston = "${COSTON2_RPC}"
staging = "${STAGING_RPC}"

[profile.coverage]
# Two coverage profiles, and the reason is a forge bug: `forge coverage` keys source identity by
# (solc version, source id), while solc numbers source ids per compilation job starting at 0. Two
# compilation jobs on the same solc version therefore collide - one file silently overwrites the
# other, the loser gets no record at all, and survivors can inherit the loser's line totals. Any
# profile that mixes viaIR and non-viaIR settings splits the build into two same-version jobs and
# corrupts the report, so each profile below must produce exactly ONE job per solc version.
#
# This profile carries no compilation_restrictions at all: coverage forces viaIR off globally, so
# [profile.default]'s viaIR restrictions collapse into the base settings without spawning a second
# job. The three contracts that then hit "stack too deep" (TeePayments, TeePaymentsUtxo and
# NodePossessionVerifier, which inlines OZ's P256) are excluded via --skip in CI and measured by
# the viair profile instead.

[profile.coverage-viair]
# The mirror image: pin every path to the viaIR profile so the forced-viaIR-off default profile has
# no files left and is never instantiated - again one job. This is the only way to measure the three
# contracts above, at the cost of skipping contracts/mock (legacy 0.6.12/0.7.6 pragmas, where viaIR
# does not exist) and contracts/rNat (Yul stack issues), plus the suites importing them. Its report
# is merged with the base profile's, which covers exactly what this one skips.
[[profile.coverage-viair.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

[[profile.coverage-viair.compilation_restrictions]]
paths = "contracts/**"
via_ir = true

[[profile.coverage-viair.compilation_restrictions]]
paths = "test-forge/**"
via_ir = true

[[profile.coverage-viair.compilation_restrictions]]
paths = "dependencies/**"
via_ir = true

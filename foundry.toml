[profile.default]
src = "contracts"
out = "artifacts-forge"
libs = ["node_modules", "lib", "dependencies"]
test = "test-forge"
cache_path = 'cache-forge'
evm_version = 'cancun'
fs_permissions = [
    { access = "read", path = "./artifacts-forge/"},
    { access = "read", path = "./deployment/chain-config/"},
    { access = "read", path = "./deployment/cuts/"},
    { access = "read-write", path = "./deployment/deploys/"},
    { access = "read-write", path = "./deployment/output-internal/"}
]
optimizer = true
optimizer_runs = 200
# viaIR enabled globally (needed to keep TeePaymentsUtxo under the contract size limit). Tests read
# block.timestamp/number via vm.getBlockTimestamp()/vm.getBlockNumber() so viaIR's constant-folding of
# those reads across vm.warp/vm.roll does not return stale values. RNat/P256/NodePossession/mocks are
# pinned to viaIR off below (Yul stack/unimplemented issues).
via_ir = true
ffi = true

[[profile.default.additional_compiler_profiles]]
name = "no-via-ir"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNat.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNatAccount.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.6.1/utils/cryptography/P256.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/*.sol"
via_ir = false

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.6.1"
flare-periphery = "0.1.38"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
flare = "${FLARE_RPC}"
songbird = "${SONGBIRD_RPC}"
coston2 = "${COSTON2_RPC}"
coston = "${COSTON2_RPC}"
staging = "${STAGING_RPC}"

[profile.coverage]
# forge coverage disables the optimizer and viaIR globally for accurate line instrumentation, but a
# few contracts only compile with viaIR (stack too deep otherwise): the TeePayments contracts, OZ's
# P256 library, and NodePossessionVerifier, which inlines it. Pin just those back to viaIR.
#
# This splits the build into two compilation jobs on one solc version. Until foundry-rs/foundry#16084
# was fixed, that silently corrupted the report - sources in one job overwrote same-numbered sources
# in the other - and we worked around it with two passes and an lcov merge. The fix keys coverage by
# build ID, so the split is safe again and one pass measures both compiler-profile groups. (Files holding only
# file-level free functions still get no records at all - foundry-rs/foundry#16085, unrelated.) Requires forge with
# https://github.com/foundry-rs/foundry/pull/16100 (nightly eb4bf9b4 or later).
[[profile.coverage.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePayments.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePaymentsUtxo.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.6.1/utils/cryptography/P256.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = true

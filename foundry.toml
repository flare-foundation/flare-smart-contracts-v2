[profile.default]
src = "contracts"
out = "artifacts-forge"
libs = ["node_modules", "lib", "dependencies"]
test = "test-forge"
cache_path = 'cache-forge'
evm_version = 'cancun'
fs_permissions = [
    { access = "read", path = "./artifacts-forge/"},
    { access = "read", path = "./deployment/chain-config/"},
    { access = "read", path = "./deployment/create3/"},
    { access = "read", path = "./deployment/cuts/"},
    { access = "read-write", path = "./deployment/deploys/"},
    { access = "read-write", path = "./deployment/output-internal/"}
]
optimizer = true
optimizer_runs = 200
# viaIR enabled globally (needed to keep TeePaymentsUtxo under the contract size limit). Tests read
# block.timestamp/number via vm.getBlockTimestamp()/vm.getBlockNumber() so viaIR's constant-folding of
# those reads across vm.warp/vm.roll does not return stale values. RNat/P256/NodePossession/mocks are
# pinned to viaIR off below (Yul stack/unimplemented issues).
via_ir = true
ffi = true
# Reference Yul IR artifacts (e.g. test-forge/fv/lean/relay_ir_optimized.yul) are kept for the
# formal-verification work but are NOT contracts to compile. Skip them so `forge build` ignores them.
skip = ['*.yul']

[[profile.default.additional_compiler_profiles]]
name = "no-via-ir"
via_ir = false

# Metadata-free profile for the frozen Create3Factory only (inherits default via_ir/optimizer/
# evm_version; strips just the solc metadata hash so the factory initcode — and thus its CREATE2
# address — is deterministic across unrelated metadata changes).
[[profile.default.additional_compiler_profiles]]
name = "no-metadata"
via_ir = true
bytecode_hash = "None"

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNat.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/rNat/implementation/RNatAccount.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.7.0/utils/cryptography/P256.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = false

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/*.sol"
via_ir = false

# Foundry minimizes the compiler count by reusing a previously selected compatible version. The
# legacy roots below seed solc 0.7.6, so broad modern pragmas must be pinned explicitly or a clean
# machine can incorrectly fold them into the legacy compilation unit.
[[profile.default.compilation_restrictions]]
paths = "contracts/{adapters,customFeeds,diamond,fastUpdates,fdc,fdc2,fscV1,ftso,governance,incentivePool,inflation,protocol,rNat,staking,tee,utils}/**/*.sol"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "contracts/userInterfaces/{fdc,fdc2,LTS,tee}/**/*.sol"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "contracts/userInterfaces/I{AddressUpdatable,Bn256,EntityManager,FastUpdateIncentiveManager,FastUpdater,FastUpdatesConfiguration,FdcHub,FdcInflationConfigurations,FdcRequestFeeConfigurations,FdcVerification,FeeCalculator,FlareSystemsManager,FtsoFeedDecimals,FtsoFeedIdConverter,FtsoFeedPublisher,FtsoInflationConfigurations,FtsoRewardOffersManager,Governor,IncreaseManager,PollingManagementGroup,PublicKey,RandomProvider,Relay,RewardManager,RNat,RNatAccount,Signature,Sortition,Submission,ValidatorRewardOffersManager,VoterPreRegistry,VoterRegistry,WNat}.sol"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "contracts/userInterfaces/{IFixedPointArithmetic,IFlareGovernance,IFlareSystemsCalculator,IOwnableWithTimelock,IWNatDelegationFee}.sol"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/{ERC20Mock.sol,IIFlareSmartContracts.sol,IIIFtsoRegistry.sol,IIIPriceSubmitter.sol,MockTeeGovernanceHashSetter.sol,PChainStakeMirrorVerifier.sol,RelayMainDeployed.sol,SuicidalMock.sol}"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "test-forge/**/*.sol"
version = "=0.8.35"

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/{CChainStake,CChainStakeBase,CChainStakeHistory,GovernanceVotePower,ImportContractMock}.sol"
version = "=0.7.6"

[[profile.default.compilation_restrictions]]
paths = "contracts/mock/Imports.sol"
version = "=0.6.12"

# The flattened v1 bundle is pinned to solc 0.7.6, whose viaIR pipeline was experimental and
# cannot compile it ("Unimplemented feature"). It is only reached through the 0.7.x mocks above,
# so pin both its compiler version and pipeline explicitly.
[[profile.default.compilation_restrictions]]
paths = "flattened/*.sol"
version = "=0.7.6"
via_ir = false

# Create3Factory is deployed via the keyless CREATE2 deployer, so its address is
# keccak(initcode)-dependent and must be metadata-independent to stay identical on every chain.
# Strip the solc metadata hash for this one contract so the frozen initcode
# (deployment/create3/Create3Factory.initcode.hex) does not drift with unrelated metadata changes.
# Everything else keeps its metadata; the Relay proxy/mirrors use CREATE3 (address independent of
# bytecode) so they need no stripping.
[[profile.default.compilation_restrictions]]
paths = "contracts/utils/implementation/Create3Factory.sol"
bytecode_hash = "None"

[invariant]
runs = 128
depth = 128
fail_on_revert = true

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.7.0"
flare-periphery = "0.1.38"
"@openzeppelin-contracts-upgradeable" = "5.7.0"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
flare = "${FLARE_RPC}"
songbird = "${SONGBIRD_RPC}"
coston2 = "${COSTON2_RPC}"
coston = "${COSTON_RPC}"
staging = "${STAGING_RPC}"

[profile.coverage]
# forge coverage disables the optimizer and viaIR globally for accurate line instrumentation, but a
# few contracts only compile with viaIR (stack too deep otherwise): the TeePayments contracts, OZ's
# P256 library, and NodePossessionVerifier, which inlines it. Pin just those back to viaIR.
#
# This splits the build into two compilation jobs on one solc version. Until foundry-rs/foundry#16084
# was fixed, that silently corrupted the report - sources in one job overwrote same-numbered sources
# in the other - and we worked around it with two passes and an lcov merge. The fix keys coverage by
# build ID, so the split is safe again and one pass measures both compiler-profile groups. (Files holding only
# file-level free functions still get no records at all - foundry-rs/foundry#16085, unrelated.) Requires forge with
# https://github.com/foundry-rs/foundry/pull/16100 (nightly eb4bf9b4 or later).
[[profile.coverage.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

# Satisfies the Create3Factory pin restriction below (optimized viaIR, metadata-free —
# byte-identical to the default profile's output, so the frozen-initcode pin holds).
[[profile.coverage.additional_compiler_profiles]]
name = "factory-pin"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "None"

[[profile.coverage.additional_compiler_profiles]]
name = "no-via-ir"
via_ir = false

# Profile restriction arrays replace (rather than extend) the default profile's array. Repeat the
# version partition so coverage is deterministic on a clean runner too.
[[profile.coverage.compilation_restrictions]]
paths = "contracts/{adapters,customFeeds,diamond,fastUpdates,fdc,fdc2,fscV1,ftso,governance,incentivePool,inflation,protocol,rNat,staking,tee,utils}/**/*.sol"
version = "=0.8.35"

[[profile.coverage.compilation_restrictions]]
paths = "contracts/userInterfaces/{fdc,fdc2,LTS,tee}/**/*.sol"
version = "=0.8.35"

[[profile.coverage.compilation_restrictions]]
paths = "contracts/userInterfaces/I{AddressUpdatable,Bn256,EntityManager,FastUpdateIncentiveManager,FastUpdater,FastUpdatesConfiguration,FdcHub,FdcInflationConfigurations,FdcRequestFeeConfigurations,FdcVerification,FeeCalculator,FlareSystemsManager,FtsoFeedDecimals,FtsoFeedIdConverter,FtsoFeedPublisher,FtsoInflationConfigurations,FtsoRewardOffersManager,Governor,IncreaseManager,PollingManagementGroup,PublicKey,RandomProvider,Relay,RewardManager,RNat,RNatAccount,Signature,Sortition,Submission,ValidatorRewardOffersManager,VoterPreRegistry,VoterRegistry,WNat}.sol"
version = "=0.8.35"

[[profile.coverage.compilation_restrictions]]
paths = "contracts/userInterfaces/{IFixedPointArithmetic,IFlareGovernance,IFlareSystemsCalculator,IOwnableWithTimelock,IWNatDelegationFee}.sol"
version = "=0.8.35"

[[profile.coverage.compilation_restrictions]]
paths = "contracts/mock/{ERC20Mock.sol,IIFlareSmartContracts.sol,IIIFtsoRegistry.sol,IIIPriceSubmitter.sol,MockTeeGovernanceHashSetter.sol,PChainStakeMirrorVerifier.sol,RelayMainDeployed.sol,SuicidalMock.sol}"
version = "=0.8.35"
via_ir = false

[[profile.coverage.compilation_restrictions]]
paths = "test-forge/**/*.sol"
version = "=0.8.35"

[[profile.coverage.compilation_restrictions]]
paths = "contracts/mock/{CChainStake,CChainStakeBase,CChainStakeHistory,GovernanceVotePower,ImportContractMock}.sol"
version = "=0.7.6"
via_ir = false

[[profile.coverage.compilation_restrictions]]
paths = "contracts/mock/Imports.sol"
version = "=0.6.12"
via_ir = false

[[profile.coverage.compilation_restrictions]]
paths = "flattened/*.sol"
version = "=0.7.6"
via_ir = false

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePayments.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/tee/implementation/TeePaymentsUtxo.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "dependencies/@openzeppelin-contracts-5.7.0/utils/cryptography/P256.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "contracts/protocol/implementation/NodePossessionVerifier.sol"
via_ir = true

# The frozen-initcode pin (RelayDeployAddress.t.sol) must hold under coverage too: compile
# Create3Factory exactly like the default profile (optimized viaIR, metadata stripped) so
# type(Create3Factory).creationCode matches the committed pin. Costs line coverage for this
# one 71-line contract — same trade as the viaIR pins above.
[[profile.coverage.compilation_restrictions]]
paths = "contracts/utils/implementation/Create3Factory.sol"
via_ir = true
optimizer_runs = 200
bytecode_hash = "None"

# The Relay deploy scripts only compile with viaIR (stack too deep in legacy codegen). They used
# to ride along in the factory-pin job because the deploy tests imported Create3Factory; those
# tests now reach the factory through its artifact, so pin the scripts explicitly.
[[profile.coverage.compilation_restrictions]]
paths = "deployment/scripts/relay/*.sol"
via_ir = true

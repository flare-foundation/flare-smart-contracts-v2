[profile.default]
src = "contracts"
out = "artifacts-forge"
libs = ["node_modules", "lib", "dependencies"]
test = "test-forge"
cache_path = 'cache-forge'
evm_version = 'cancun'
fs_permissions = [
  { access = "read", path = "./artifacts-forge/"},
  { access = "read", path = "./node_modules/@gnosis.pm/safe-contracts/build/artifacts/"}
]
optimizer = true
optimizer_runs = 200
# Reference Yul IR artifacts (e.g. test-forge/fv/lean/relay_ir_optimized.yul) are kept for the
# formal-verification work but are NOT contracts to compile. Skip them so `forge build` (and its
# solar lint-on-build pass, which cannot parse solc's string-literal `object` names) ignores them.
skip = ['*.yul']

[invariant]
runs = 128
depth = 128
fail_on_revert = true

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.4.0"
flare-periphery = "0.1.38"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
flare = "${FLARE_RPC}"
songbird = "${SONGBIRD_RPC}"
coston2 = "${COSTON2_RPC}"
coston = "${COSTON2_RPC}"
staging = "${STAGING_RPC}"

[profile.coverage]
# Remap OZ P256 library to mock library to avoid stack to deep in coverage
remappings = [
  "@openzeppelin/contracts/utils/cryptography/P256.sol=contracts/mock/MockP256.sol"
]

# Prevent duplicate pipelines (MR and BRANCH pipelines, when a MR is opened for the given branch)
workflow:
  rules:
  - if: '$CI_OPEN_MERGE_REQUESTS != null && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "webide")'
    when: never
  - when: always

default:
  tags: [ flarenetwork ]

variables:
  PNPM_STORE_DIR: .pnpm-store


##
## PARTIALS
##

.partials:
  # The Foundry image, in one place. Two requirements: solar >= v0.2.0, since this repo uses solc
  # 0.8.35's `erc7201` builtin and older solar reports "unresolved symbol erc7201" while solc
  # compiles fine; and the coverage build-ID fix (foundry-rs/foundry#16084, landed in nightly
  # eb4bf9b4), without which `forge coverage` silently drops sources whenever one solc version has
  # two compilation jobs - which our coverage profile deliberately creates.
  #
  # `latest` currently serves forge 1.8.0-nightly (eb4bf9b4) and satisfies both; `stable` is still
  # v1.7.1 and satisfies neither. Note `latest` is mutable - rebuilding the image moves the
  # toolchain under CI with no commit here explaining it.
  # `flarefoundation/foundry-custom:forge-nightly-eb4bf9b4` is the same digest under an immutable
  # name if a run ever needs pinning.
  foundry-image: flarefoundation/foundry-custom:latest
  # Formal evidence remains bound to the manifest-pinned Foundry binary. Keep this separate from
  # the mutable coverage image above: changing it requires regenerating every commit-bound report.
  fv-foundry-image: flarefoundation/foundry-custom:forge-nightly-160b6026@sha256:47041ac6a92be3551e1987e0dbb4505e2039a491820decb0e98d70a6d6f7edbc
  cache-nodejs:
    key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull
  # Same cache, read-write: for jobs pinned to the flarenetwork-md runner, whose runner-local cache the
  # (untagged) build-smart-contracts job can never seed. With pull-push, the first self-provisioned run
  # (see the node_modules fallback in those jobs) warms the local cache for subsequent runs.
  cache-nodejs-rw:
    key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull-push


##
## SCANNERS
##

include:
- template: Jobs/SAST.latest.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
- template: Jobs/Secret-Detection.latest.gitlab-ci.yml


sast:
  needs: []

dependency_scanning:
  needs: []

.secret-analyzer:
  needs: []


scanner-slither:
  image: node:24
  timeout: 10 minutes
  tags: [ flarenetwork-lg ]
  needs: []
  cache: [ !reference [.partials, cache-nodejs] ]
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  retry: 1
  before_script:
  - apt-get update 1> /dev/null
  - apt-get install -y python3-pip 1> /dev/null
  - pip3 install slither-analyzer 1> /dev/null
  - corepack enable && pnpm install --frozen-lockfile
  - rm -f ./slither.json ./slither_badge.json
  script:
  - (slither . --json=./slither.json || if [ $? = 1 ]; then exit 1; else exit 0; fi)
  - node scripts/slither-parse.js ./slither.json
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ slither.json ]



build-smart-contracts:
  stage: build
  needs: []
  image: node:24
  timeout: 10 minutes
  tags: [ flarenetwork-lg ]
  before_script:
  - corepack enable && pnpm install --frozen-lockfile
  script:
  - pnpm compile
  - node scripts/relay-artifact-provenance.js --output verification-reports/relay-deployment.json
  cache:
  - key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull-push
  artifacts:
    paths:
    - typechain
    - typechain-truffle
    - typechain-web3
    - verification-reports/relay-deployment.json
    expire_in: 1 week



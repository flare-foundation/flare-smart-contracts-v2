# Prevent duplicate pipelines (MR and BRANCH pipelines, when a MR is opened for the given branch)
workflow:
  rules:
  - if: '$CI_OPEN_MERGE_REQUESTS != null && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "webide")'
    when: never
  - when: always

default:
  tags: [ flarenetwork ]

variables:
  PNPM_STORE_DIR: .pnpm-store


##
## PARTIALS
##

.partials:
  # Pinned Foundry, one place to bump. The exact tag matters: this repo uses solc 0.8.35's
  # `erc7201` builtin, which forge's own Solidity front end (solar) only understands from
  # v0.2.0, first shipped in the 2026-07-08 nightly. An older forge reports "unresolved symbol
  # erc7201" from `forge build` and `forge coverage` while solc compiles the contracts fine.
  # `stable` is still v1.7.1 (2026-05-08) and predates it, and a floating tag (`latest`,
  # `nightly`) moves the toolchain underneath CI with no commit here to explain the change -
  # so pin the full tag and bump it deliberately. Retire the nightly for `stable` once a
  # stable release past v1.7.1 carries solar 0.2.0.
  foundry-image: flarefoundation/foundry-custom:forge-nightly-160b6026
  cache-nodejs:
    key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull
  # Same cache, read-write: for jobs pinned to the flarenetwork-md runner, whose runner-local cache the
  # (untagged) build-smart-contracts job can never seed. With pull-push, the first self-provisioned run
  # (see the node_modules fallback in those jobs) warms the local cache for subsequent runs.
  cache-nodejs-rw:
    key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull-push


##
## SCANNERS
##

include:
- template: Jobs/SAST.latest.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
- template: Jobs/Secret-Detection.latest.gitlab-ci.yml


sast:
  needs: []

dependency_scanning:
  needs: []

.secret-analyzer:
  needs: []


scanner-slither:
  image: node:24
  timeout: 10 minutes
  tags: [ flarenetwork-lg ]
  needs: []
  cache: [ !reference [.partials, cache-nodejs] ]
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  retry: 1
  before_script:
  - apt-get update 1> /dev/null
  - apt-get install -y python3-pip 1> /dev/null
  - pip3 install slither-analyzer 1> /dev/null
  - corepack enable && pnpm install --frozen-lockfile
  - rm -f ./slither.json ./slither_badge.json
  script:
  - (slither . --json=./slither.json || if [ $? = 1 ]; then exit 1; else exit 0; fi)
  - node scripts/slither-parse.js ./slither.json
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ slither.json ]



build-smart-contracts:
  stage: build
  needs: []
  image: node:24
  timeout: 10 minutes
  tags: [ flarenetwork-lg ]
  before_script:
  - corepack enable && pnpm install --frozen-lockfile
  script:
  - pnpm compile
  - node scripts/relay-artifact-provenance.js --output verification-reports/relay-deployment.json
  cache:
  - key:
      files: [ pnpm-lock.yaml ]
    paths:
    - $PNPM_STORE_DIR
    - node_modules/
    policy: pull-push
  artifacts:
    paths:
    - typechain
    - typechain-truffle
    - typechain-web3
    - verification-reports/relay-deployment.json
    expire_in: 1 week



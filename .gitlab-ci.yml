# Prevent duplicate pipelines (MR and BRANCH pipelines, when a MR is opened for the given branch)
workflow:
  rules:
  - if: '$CI_OPEN_MERGE_REQUESTS != null && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "webide")'
    when: never
  - when: always

default:
  tags: [ flarenetwork ]

variables:
  YARN_CACHE_DIR: .yarn-cache


##
## PARTIALS
##

.partials:
  cache-nodejs:
    key:
      files: [ yarn.lock ]
    paths:
    - $YARN_CACHE_DIR
    - node_modules/
    policy: pull


##
## SCANNERS
##


include:
- template: Jobs/SAST.latest.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
- template: Jobs/Secret-Detection.latest.gitlab-ci.yml


sast:
  needs: []

dependency_scanning:
  needs: []

.secret-analyzer:
  needs: []




scanner-slither:
  image: node:18
  timeout: 10 minutes
  needs: []
  cache: [ !reference [.partials, cache-nodejs] ]
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  retry: 1
  before_script:
  - apt-get update 1> /dev/null
  - apt-get install -y python3-pip 1> /dev/null
  - pip3 install slither-analyzer 1> /dev/null
  - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_DIR
  - rm -f ./slither.json ./slither_badge.json
  script:
  - (slither . --json=./slither.json || if [ $? = 1 ]; then exit 1; else exit 0; fi)
  - node scripts/slither-parse.js ./slither.json
  artifacts:
    when: always
    expire_in: 7 days
    paths: [ slither.json ]

##
##
##

build-smart-contracts:
  stage: build
  needs: []
  image: node:18
  timeout: 10 minutes
  before_script:
  - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_DIR
  script:
  - yarn c
  cache:
  - key:
      files: [ yarn.lock ]
    paths:
    - $YARN_CACHE_DIR
    - node_modules/
    policy: pull-push
  artifacts:
    paths:
    - typechain
    - typechain-truffle
    - typechain-web3
    expire_in: 1 week

##
## UNIT TESTS
##




.test-node-sc:
  image: node:18
  timeout: 10 minutes
  needs:
  - job: build-smart-contracts
    artifacts: true
  cache: [ !reference [.partials, cache-nodejs] ]
  variables:
    DEPLOYER_PRIVATE_KEY: "0xc5e8f61d1ab959b397eecc0a37a6517b8e67a0e7cf1f4bce5591f3ed80199122"
    GENESIS_GOVERNANCE_PRIVATE_KEY: "0x50777f5a3ce16445e63411bf1e865a2a11d5ca3c4cbc1de00808a52180bd8d3c"
    GOVERNANCE_PRIVATE_KEY: "0xd49743deccbccc5dc7baa8e69e5be03298da8688a15dd202e20f15d5e0e9a9fb"
    GOVERNANCE_PUBLIC_KEY: "0xeAD9C93b79Ae7C1591b1FB5323BD777E86e150d4"
    GOVERNANCE_EXECUTOR_PUBLIC_KEY: "0xE5904695748fe4A84b40b3fc79De2277660BD1D3"
  before_script:
  - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_DIR 1>/dev/null

test-unit-hardhat:
  extends: .test-node-sc
  parallel:
    matrix:
    - TEST_ARG:
      - ./test/unit/protocol/coding/coding.test.ts
      - ./test/unit/protocol/implementation/RewardManager.test.ts
      - ./test/unit/protocol/implementation/Submission.test.ts
      - ./test/unit/fastUpdates/lib/Bn256.test.ts
      - ./test/unit/fastUpdates/lib/FixedPointArithmetic.test.ts
      - ./test/unit/fastUpdates/lib/Sortition.test.ts
  script:
  - yarn hardhat test --network hardhat ${TEST_ARG}

test-unit-hardhat-md:
  extends: test-unit-hardhat
  timeout: 10 minutes
  tags: [ flarenetwork-md ]
  parallel:
    matrix:
    - TEST_ARG:
      - ./test/unit/protocol/implementation/Relay.test.ts
      - ./test/unit/fastUpdates/implementation/FastUpdateIncentiveManager.test.ts
      - ./test/unit/fastUpdates/implementation/FastUpdater.test.ts

test-contract-end-to-end:
  extends: .test-node-sc
  tags: [ flarenetwork-md ]
  script:
  - yarn hardhat test ./test/integration/EndToEnd.test.ts

test-linter:
  extends: .test-node-sc
  script:
  - yarn lint

test-linter-forge:
  extends: .test-node-sc
  script:
  - yarn lint-forge

test-unit-forge:
  extends: .test-node-sc
  timeout: 10 minutes
  tags: [ flarenetwork-md ]
  image: ghcr.io/foundry-rs/foundry:stable
  before_script:
  - forge soldeer install
  - forge install --no-git
  - forge build
  script:
  - forge test -vvv

##
## FORMAL VERIFICATION (Halmos)
##

# Gate for the Relay.sol formal-verification suite (test-forge/fv). Enforces BOTH halves of every
# proof: each PROOF check passes, and each REACHABILITY / non-vacuity control produces a counterexample.
# An unexpected reachability PASS is a hard failure ("vacuity alarm") — that is what would happen if the
# Halmos --loop bound (halmos.toml: loop=6) ever dropped below a harness's signer count, silently making
# the proofs vacuous. See docs/relay-fv.md. verify_fv.py judges via Halmos JSON (Halmos's own exit code
# is non-zero by design, since the reachability controls produce counterexamples).
test-fv-halmos:
  # depend on build-smart-contracts and pull its node_modules cache: forge build needs the npm-resolved
  # remappings (e.g. @gnosis.pm/mock-contract) that live under node_modules/, exactly like test-unit-forge
  # (which gets them via .test-node-sc). soldeer + forge install cover the non-npm deps.
  needs:
  - job: build-smart-contracts
    artifacts: false
  cache: [ !reference [.partials, cache-nodejs] ]
  timeout: 20 minutes
  tags: [ flarenetwork-md ]
  # The foundry:stable image has ONLY forge (no python/curl/apt, non-root), so halmos can't be added to
  # it. Use the full python:3.12 image instead (bundles git + curl), install halmos via pip and foundry
  # via foundryup. pip --user and foundryup both write under $HOME, so this works whether or not the
  # runner enforces non-root.
  image: python:3.12
  variables:
    FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
  rules:
  - changes:
    - contracts/protocol/implementation/Relay.sol
    - contracts/protocol/interface/IIRelay.sol
    - contracts/userInterfaces/IRelay.sol
    - test-forge/fv/**/*
    - halmos.toml
  before_script:
  - python3 --version; git --version; curl --version | head -1   # env diagnostics
  - pip install --user halmos
  - curl -L https://foundry.paradigm.xyz | bash
  - export PATH="$HOME/.local/bin:$HOME/.foundry/bin:$PATH"
  - foundryup
  - forge soldeer install
  - forge install --no-git
  - forge build
  script:
  - export PATH="$HOME/.local/bin:$HOME/.foundry/bin:$PATH"
  - HALMOS=halmos python3 test-forge/fv/verify_fv.py

# Gate for the Lean bytecode-refinement proofs (test-forge/fv/lean/bytecode-refinement). Type-checks every
# file against the PINNED NethermindEth EVMYulLean semantics and enforces that the results stay HOLE-FREE:
# `lake env lean` must exit 0 (no error), and every `#print axioms` must list only allowed axioms — no
# `sorryAx`, no `native_decide`, nothing beyond Lean's three foundational axioms plus the two documented,
# upstream-dischargeable data-layer specs (zeroes_data, toByteArray_size). Complements test-fv-halmos: the
# Halmos harnesses and the Lean refinement are the two FV strands, and this keeps the Lean side — the
# strongest results (∀N soundness on validated EVM semantics, incl. the literal loop-body model) — from
# silently regressing. verify_lean.py fails independently of Lake's own success reporting: a proof that
# still builds but acquired a `sorry` passes `lake` yet fails this gate. See docs/relay-verification/ L7/L11.
test-fv-lean:
  needs: []
  timeout: 60 minutes
  tags: [ flarenetwork-md ]
  # python:3.12 bundles git + curl; elan (Lean's toolchain manager) is installed under $CI_PROJECT_DIR, and
  # the pinned Lean toolchain is auto-provisioned from EVMYulLean's lean-toolchain on first `lake` call.
  image: python:3.12
  variables:
    EVMYUL_COMMIT: "047f63070309f436b66c61e276ab3b6d1169265a"   # 2025-09-24 — the checked commit (NOT HEAD)
    ELAN_HOME: "$CI_PROJECT_DIR/.elan"
  rules:
  - changes:
    - test-forge/fv/lean/bytecode-refinement/**/*
    - test-forge/fv/lean/verify_lean.py
  before_script:
  - python3 --version; git --version; curl --version | head -1   # env diagnostics
  - curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
  - export PATH="$ELAN_HOME/bin:$PATH"
  # build the validated semantics once, pinned; cache get pulls prebuilt Mathlib+deps oleans, then build EvmYul
  - git clone https://github.com/NethermindEth/EVMYulLean /tmp/evmyul
  - git -C /tmp/evmyul checkout "$EVMYUL_COMMIT"
  - (cd /tmp/evmyul && lake exe cache get && lake build)
  script:
  - export PATH="$ELAN_HOME/bin:$PATH"
  - EVMYUL_DIR=/tmp/evmyul python3 test-forge/fv/lean/verify_lean.py

# Keeps the verification docs' code links honest. The docs use SYMBOL-ADDRESSED links (link text = the
# function/theorem name, anchor = single line `#L<n>` of its definition — single-line anchors render on
# both GitLab and GitHub; ranges do not). verify_links.py recomputes every anchor from the sources and
# fails if any link is stale, any plain mention of an indexed artifact is unlinked, or any anchor points
# past EOF. Fix locally with: python3 docs/relay-verification/verify_links.py --fix
test-doc-links:
  needs: []
  timeout: 5 minutes
  tags: [ flarenetwork-md ]
  image: python:3.12
  rules:
  - changes:
    - docs/relay-verification/**/*
    - docs/relay-verification-summary.md
    - test-forge/fv/**/*
    - test-forge/unit/protocol/implementation/Relay.t.sol
    - certora/specs/**/*
  script:
  - python3 docs/relay-verification/verify_links.py --check

##
## COVERAGE
##

coverage-hardhat:
  image: node:18
  needs: []
  timeout: 30 minutes
  tags: [ flarenetwork-lg-cpu ] # 16gb RAM
  cache: [ !reference [.partials, cache-nodejs] ]
  before_script:
  - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_DIR 1>/dev/null
  script:
  - yarn run coverage
  - cp coverage/cobertura-coverage.xml coverage-hardhat-cobertura.xml
  artifacts:
    name: coverage-hardhat
    when: always
    expire_in: 1 month
    paths:
    - ./coverage/
    - ./coverage.json
    - coverage-hardhat-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml


coverage-forge-node_modules:
  stage: .pre
  needs: []
  image: node:18
  timeout: 7 minutes
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
  - apt-get update -y && apt-get install -y rsync
  script:
  - yarn install --frozen-lockfile --cache-folder $YARN_CACHE_DIR
  - rsync -zarvm --include "*/" --include="*.sol" --exclude="*" node_modules/ node_modules.sol
  artifacts:
    expire_in: 5 minutes
    paths:
    - node_modules.sol

coverage-forge:
  image: ghcr.io/foundry-rs/foundry:stable
  needs:
  - job: coverage-forge-node_modules
    artifacts: true
  tags: [ flarenetwork-md ]
  timeout: 10 minutes
  before_script:
  - mv node_modules.sol node_modules
  - forge soldeer install
  - forge install --no-git
  - forge build
  script:
  - FOUNDRY_PROFILE=coverage forge coverage --report summary --report lcov
  artifacts:
    expire_in: 30 days
    paths:
    - lcov.info

coverage-forge-reports:
  image: node:18-alpine
  timeout: 4 minutes
  needs:
  - job: coverage-forge
    artifacts: true
  before_script:
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
  - apk add --no-cache python3 py3-pip lcov 1>/dev/null
  - apk upgrade --no-cache 1>/dev/null
  - pip3 install --break-system-packages lcov_cobertura 1>/dev/null
  script:
  - node scripts/forge-lcov-prune.js
  - genhtml lcov.info.pruned --branch-coverage --output-dir coverage-forge --ignore-errors inconsistent
  - lcov_cobertura lcov.info.pruned --output coverage-forge-cobertura.xml
  - lcov --summary lcov.info.pruned --rc branch_coverage=1 --ignore-errors inconsistent
  coverage: '/  lines[\ .:]+\d+\.\d+%/' # https://regex101.com/r/KVj9Dr/1
  artifacts:
    expire_in: 30 days
    paths:
    - lcov.info.pruned
    - coverage-forge
    - coverage-forge-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-forge-cobertura.xml


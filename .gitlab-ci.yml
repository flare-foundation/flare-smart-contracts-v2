##
## FORMAL VERIFICATION (Halmos)
##

# Gate for the Relay.sol formal-verification suite (test-forge/fv). Enforces BOTH halves of every
# proof: each PROOF check passes, and each REACHABILITY / non-vacuity control produces a counterexample.
# An unexpected reachability PASS is a hard failure ("vacuity alarm") — that is what would happen if the
# Halmos --loop bound (halmos.toml: loop=6) ever dropped below a harness's signer count, silently making
# the proofs vacuous. See docs/relay-verification/04-R2-bounded-symbolic-halmos.md.
# verify_fv.py judges via Halmos JSON (Halmos's own exit code
# is non-zero by design, since the reachability controls produce counterexamples).
test-fv-halmos:
  # depend on build-smart-contracts and pull its node_modules cache: forge build needs the npm-resolved
  # remappings that live under node_modules/, exactly like test-unit-forge
  # (which gets them via .test-node-sc). soldeer + forge install cover the non-npm deps.
  needs:
  - job: build-smart-contracts
    artifacts: true
  cache: [ !reference [.partials, cache-nodejs-rw] ]
  timeout: 60 minutes
  tags: [ flarenetwork-md ]
  # Use the FV suite's erc7201-capable, digest-pinned Foundry build. General production tests track
  # the newer mutable `foundry-custom:latest` image independently. This FV image is built from
  # node:24.19.0-bookworm; Debian's Python 3.11 and the version-pinned Halmos dependency list pin
  # package versions (the pip lock does not include artifact hashes).
  image: !reference [.partials, fv-foundry-image]
  variables:
    FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    FV_FOUNDRY_IMAGE: "flarefoundation/foundry-custom:forge-nightly-160b6026@sha256:47041ac6a92be3551e1987e0dbb4505e2039a491820decb0e98d70a6d6f7edbc"
  rules:
  - changes:
    - contracts/protocol/**/*
    - contracts/utils/**/*
    - contracts/userInterfaces/**/*
    - certora/**/*
    - test-forge/fv/**/*
    - test-forge/unit/**/*
    - test-forge/utils/**/*
    - test-forge/invariant/**/*
    - halmos.toml
    - foundry.toml
    - hardhat.config.ts
    - scripts/relay-artifact-provenance.js
    - scripts/bootstrap-fv.sh
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - soldeer.lock
    - remappings.txt
    - .gitlab-ci.yml
  before_script:
  - apt-get update -qq && apt-get install -y -qq python3 python3-venv > /dev/null
  - python3 --version; node --version; npm --version; git --version; curl --version | head -1
  # The deployment provenance wrapper recreates ignored node_modules from the committed lock.
  - npm install --global pnpm@10.33.0
  - python3 -m venv /tmp/relay-halmos-venv
  - /tmp/relay-halmos-venv/bin/pip install -r test-forge/fv/requirements-halmos.lock
  - forge --version
  script:
  - /tmp/relay-halmos-venv/bin/python -m unittest discover -s test-forge/fv/tests -v
  - node scripts/relay-artifact-provenance.js --output verification-reports/relay-deployment.json
  - /tmp/relay-halmos-venv/bin/python test-forge/fv/verify_relay_custom_error_abi.py --report-output verification-reports/relay-custom-error-abi.json
  - /tmp/relay-halmos-venv/bin/python test-forge/fv/verify_relay_artifact.py --deployment-report verification-reports/relay-deployment.json --report-output verification-reports/relay-artifact-parity.json
  - HALMOS=/tmp/relay-halmos-venv/bin/halmos /tmp/relay-halmos-venv/bin/python test-forge/fv/verify_fv.py --report-output verification-reports/relay-halmos.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - verification-reports/relay-deployment.json
    - verification-reports/relay-custom-error-abi.json
    - verification-reports/relay-artifact-parity.json
    - verification-reports/relay-halmos.json

# Local Certora front-end gate. This checks Solidity compilation, CVL type-checking, and the exact
# production-to-harness munge; it deliberately does not claim a cloud prover verdict.
test-fv-certora-local:
  needs: []
  timeout: 45 minutes
  tags: [ flarenetwork-md ]
  image: !reference [.partials, fv-foundry-image]
  variables:
    TEMURIN_URL: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12_8.tar.gz"
    TEMURIN_SHA256: "e4446ff06a276155697597cc0f1b15da004ff083f4964a35271ecee567177370"
    SOLC_URL: "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.35+commit.47b9dedd"
    SOLC_SHA256: "fa8ac9a32d301ad023a36ee5a29f8e291fe3200c60244e43c142539e82a617f4"
  rules:
  - changes:
    - contracts/protocol/**/*
    - contracts/utils/**/*
    - contracts/userInterfaces/**/*
    - certora/**/*
    - test-forge/fv/**/*
    - test-forge/unit/**/*
    - test-forge/utils/**/*
    - test-forge/invariant/**/*
    - halmos.toml
    - foundry.toml
    - hardhat.config.ts
    - scripts/relay-artifact-provenance.js
    - scripts/bootstrap-fv.sh
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - soldeer.lock
    - remappings.txt
    - .gitlab-ci.yml
  before_script:
  - apt-get update -qq && apt-get install -y -qq python3 python3-venv > /dev/null
  - node --version; npm --version; forge --version
  - python3 -m venv /tmp/relay-certora-venv
  - /tmp/relay-certora-venv/bin/pip install certora-cli==8.16.1
  - mkdir -p /tmp/temurin21
  - curl --fail --location --retry 3 --output /tmp/temurin21.tar.gz "$TEMURIN_URL"
  - echo "$TEMURIN_SHA256  /tmp/temurin21.tar.gz" | sha256sum --check --strict
  - tar -xzf /tmp/temurin21.tar.gz -C /tmp/temurin21 --strip-components=1
  - curl --fail --location --retry 3 --output /tmp/solc-0.8.35 "$SOLC_URL"
  - echo "$SOLC_SHA256  /tmp/solc-0.8.35" | sha256sum --check --strict
  - chmod +x /tmp/solc-0.8.35
  - export PATH="/tmp/temurin21/bin:/tmp/relay-certora-venv/bin:$PATH"
  script:
  - export JAVA_HOME=/tmp/temurin21
  - export PATH="$JAVA_HOME/bin:/tmp/relay-certora-venv/bin:$PATH"
  - python3 test-forge/fv/verify_certora_local.py --solc /tmp/solc-0.8.35 --report-output verification-reports/relay-certora-local.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - verification-reports/relay-certora-local.json

# The bundle is the hand-off artifact: it binds passing evidence to the Git commit,
# the manifest hash, and the SHA-256 of every report. Keep this deliberately separate
# from the individual gates so a partial or stale report cannot be presented as a run.
test-fv-bundle:
  needs:
  - job: test-fv-halmos
    artifacts: true
  - job: test-fv-lean
    artifacts: true
  - job: test-fv-certora-local
    artifacts: true
  rules:
  - changes:
    - contracts/protocol/**/*
    - contracts/utils/**/*
    - contracts/userInterfaces/**/*
    - test-forge/fv/**/*
    - test-forge/unit/**/*
    - test-forge/utils/**/*
    - test-forge/invariant/**/*
    - halmos.toml
    - foundry.toml
    - hardhat.config.ts
    - scripts/relay-artifact-provenance.js
    - certora/**/*
    - test-forge/fv/verify_certora_local.py
    - scripts/bootstrap-fv.sh
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - soldeer.lock
    - remappings.txt
    - .gitlab-ci.yml
  image: python:3.11.6-bookworm@sha256:ba7a7ac30c38e119c4304f98ef0e188f90f4f67a958bb6899da9defb99bfb471
  script:
  - python3 test-forge/fv/verify_bundle.py --output verification-reports/relay-fv-bundle.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - verification-reports/relay-fv-bundle.json

# Gate for the Lean bytecode-refinement proofs (test-forge/fv/lean/bytecode-refinement). Type-checks every
# file against the PINNED NethermindEth EVMYulLean semantics and enforces that the results stay HOLE-FREE:
# `lake env lean` must exit 0 (no error), and every `#print axioms` must list only allowed axioms — no
# `sorryAx`, no `native_decide`, nothing beyond Lean's three foundational axioms plus the three documented,
# upstream-dischargeable local declarations (RelayDataLayer.zeroes_data, RelayDataLayer.toByteArray_size,
# RelayWindows.zeroes_data). Complements test-fv-halmos: the
# Halmos harnesses and the Lean refinement are the two FV strands, and this keeps the Lean side — the
# strongest results (∀N soundness on validated EVM semantics, incl. the literal loop-body model) — from
# silently regressing. verify_lean.py fails independently of Lake's own success reporting: a proof that
# still builds but acquired a `sorry` passes `lake` yet fails this gate. See docs/relay-verification/00-README.md.
test-fv-lean:
  needs: []
  timeout: 60 minutes
  tags: [ flarenetwork-md ]
  image: python:3.11.6-bookworm@sha256:ba7a7ac30c38e119c4304f98ef0e188f90f4f67a958bb6899da9defb99bfb471
  variables:
    # Keep the pinned Lean toolchain outside the checkout so the provenance gate starts and ends clean.
    ELAN_HOME: "/tmp/relay-fv-elan"
    ELAN_VERSION: "v4.2.3"
    ELAN_ARCHIVE_SHA256: "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
  rules:
  - changes:
    - contracts/protocol/**/*
    - contracts/utils/**/*
    - contracts/userInterfaces/**/*
    - certora/**/*
    - test-forge/fv/**/*
    - test-forge/unit/**/*
    - test-forge/utils/**/*
    - test-forge/invariant/**/*
    - halmos.toml
    - foundry.toml
    - hardhat.config.ts
    - scripts/relay-artifact-provenance.js
    - scripts/bootstrap-fv.sh
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - soldeer.lock
    - remappings.txt
    - .gitlab-ci.yml
  before_script:
  - python3 --version; git --version; curl --version | head -1   # env diagnostics
  - curl --fail --location --retry 3 --output /tmp/elan.tar.gz "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
  - echo "$ELAN_ARCHIVE_SHA256  /tmp/elan.tar.gz" | sha256sum --check --strict
  - tar -xzf /tmp/elan.tar.gz -C /tmp
  - /tmp/elan-init -y --default-toolchain none
  - export PATH="$ELAN_HOME/bin:$PATH"
  - export EVMYUL_COMMIT="$(python3 -c 'import json; print(json.load(open("test-forge/fv/verification-manifest.json"))["toolchain"]["evmyullean_commit"])')"
  # build the validated semantics once, pinned; cache get pulls prebuilt Mathlib+deps oleans, then build EvmYul
  - git clone https://github.com/NethermindEth/EVMYulLean /tmp/evmyul
  - git -C /tmp/evmyul checkout "$EVMYUL_COMMIT"
  - (cd /tmp/evmyul && lake exe cache get && lake build)
  script:
  - export PATH="$ELAN_HOME/bin:$PATH"
  - EVMYUL_DIR=/tmp/evmyul python3 test-forge/fv/lean/verify_lean.py --report-output verification-reports/relay-lean.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - verification-reports/relay-lean.json

# Keeps the verification docs' code links honest. The docs use SYMBOL-ADDRESSED links (link text = the
# function/theorem name, anchor = single line `#L<n>` of its definition — single-line anchors render on
# both GitLab and GitHub; ranges do not). verify_links.py recomputes every anchor from the sources and
# fails if any link is stale, any plain mention of an indexed artifact is unlinked, or any anchor points
# past EOF. Fix locally with: python3 docs/relay-verification/verify_links.py --fix
test-doc-links:
  needs: []
  timeout: 5 minutes
  tags: [ flarenetwork-md ]
  image: python:3.12
  rules:
  - changes:
    - docs/relay-verification/**/*
    - docs/relay-verification-summary.md
    - docs/relay-governance.md
    - certora/README.md
    - contracts/protocol/**/*
    - contracts/utils/**/*
    - contracts/userInterfaces/**/*
    - certora/**/*
    - test-forge/fv/**/*
    - test-forge/unit/**/*
    - test-forge/utils/**/*
    - test-forge/invariant/**/*
    - pnpm-workspace.yaml
    - soldeer.lock
    - scripts/bootstrap-fv.sh
    - .gitlab-ci.yml
  script:
  - python3 docs/relay-verification/verify_links.py --check

##
## COVERAGE
##

coverage-hardhat:
  image: node:24
  needs: []
  timeout: 30 minutes
  tags: [ flarenetwork-lg-cpu ] # 16gb RAM
  cache: [ !reference [.partials, cache-nodejs] ]
  before_script:
  - corepack enable && pnpm install --frozen-lockfile 1>/dev/null
  script:
  - pnpm coverage
  - cp coverage/cobertura-coverage.xml coverage-hardhat-cobertura.xml
  artifacts:
    name: coverage-hardhat
    when: always
    expire_in: 1 month
    paths:
    - ./coverage/
    - ./coverage.json
    - coverage-hardhat-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml


coverage-forge-node_modules:
  stage: .pre
  needs: []
  image: node:24
  timeout: 7 minutes
  tags: [ flarenetwork-lg ]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
  - apt-get update -y && apt-get install -y rsync
  script:
  - corepack enable && pnpm install --frozen-lockfile
  - rsync -zarvm --include "*/" --include="*.sol" --include="*.js" --include="*.cjs" --include="*.mjs" --include="*.json" --exclude="*" node_modules/ node_modules.sol
  artifacts:
    expire_in: 5 minutes
    paths:
    - node_modules.sol

coverage-forge:
  image: !reference [.partials, foundry-image]
  needs:
  - job: coverage-forge-node_modules
    artifacts: true
  tags: [ flarenetwork-lg ]
  timeout: 15 minutes  # one pass compiles both compiler-profile groups
  before_script:
  - mv node_modules.sol node_modules
  - forge soldeer install
  - forge install --no-git
  # Warm the shared SVM compiler path once before parallel compiler profiles try to install it.
  - forge build contracts/tee/library/EvmAddress.sol --use 0.8.35 --no-auto-detect --threads 1
  - forge build
  script:
  - FOUNDRY_PROFILE=coverage forge coverage --report summary --report lcov
  artifacts:
    expire_in: 30 days
    paths:
    - lcov.info

coverage-forge-reports:
  image: node:24-alpine
  timeout: 4 minutes
  needs:
  - job: coverage-forge
    artifacts: true
  before_script:
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
  - echo "https://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
  - apk add --no-cache python3 py3-pip lcov 1>/dev/null
  - apk upgrade --no-cache 1>/dev/null
  - pip3 install --break-system-packages lcov_cobertura 1>/dev/null
  script:
  - node scripts/forge-lcov-prune.js
  - genhtml lcov.info.pruned --branch-coverage --output-dir coverage-forge --ignore-errors inconsistent
  - lcov_cobertura lcov.info.pruned --output coverage-forge-cobertura.xml
  - lcov --summary lcov.info.pruned --rc branch_coverage=1 --ignore-errors inconsistent
  coverage: '/  lines[\ .:]+\d+\.\d+%/' # https://regex101.com/r/KVj9Dr/1
  artifacts:
    expire_in: 30 days
    paths:
    - lcov.info.pruned
    - coverage-forge
    - coverage-forge-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-forge-cobertura.xml

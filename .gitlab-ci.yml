stages:
  - build
  - test
  - sbom

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG

.partials:
  # The Foundry image, in one place. It must carry forge with solar >= v0.2.0: this repo uses
  # solc 0.8.35's `erc7201` builtin, and an older solar reports "unresolved symbol erc7201" from
  # `forge build` and `forge coverage` while solc compiles the contracts fine. `latest` currently
  # serves forge 1.7.2-nightly (160b6026), which is new enough; `stable` is still v1.7.1 and is
  # not. Note `latest` is mutable - rebuilding the image moves the toolchain under CI with no
  # commit here explaining it. `flarefoundation/foundry-custom:forge-nightly-160b6026` is the
  # same digest under an immutable name if a run ever needs pinning.
  foundry-image: flarefoundation/foundry-custom:latest

.pnpm-cache:
  cache:
    key:
      files:
        - "$CI_PROJECT_DIR/pnpm-lock.yaml"
    paths:
      - node_modules/

.test:
  image: node:24
  timeout: 10 minutes
  extends:
    - .pnpm-cache
  needs:
    - job: build-smart-contracts
      artifacts: true
  variables:
    DEPLOYER_PRIVATE_KEY: "0xc5e8f61d1ab959b397eecc0a37a6517b8e67a0e7cf1f4bce5591f3ed80199122"
    GENESIS_GOVERNANCE_PRIVATE_KEY: "0x50777f5a3ce16445e63411bf1e865a2a11d5ca3c4cbc1de00808a52180bd8d3c"
    GOVERNANCE_PRIVATE_KEY: "0xd49743deccbccc5dc7baa8e69e5be03298da8688a15dd202e20f15d5e0e9a9fb"
    GOVERNANCE_PUBLIC_KEY: "0xeAD9C93b79Ae7C1591b1FB5323BD777E86e150d4"
    GOVERNANCE_EXECUTOR_PUBLIC_KEY: "0xE5904695748fe4A84b40b3fc79De2277660BD1D3"
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-shell@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-dockerfile@2
  - template: Jobs/SAST.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml


sast:
  needs: []

.secret-analyzer:
  needs: []

build-smart-contracts:
  image: node:24
  extends:
    - .pnpm-cache
  stage: build
  tags: [flarenetwork-lg]
  needs: []
  timeout: 10 minutes
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm compile
  artifacts:
    paths:
      - typechain
      - typechain-truffle
      - typechain-web3
    expire_in: 1 week

scanner-slither:
  image: node:24
  extends:
    - .pnpm-cache
  stage: test
  tags: [flarenetwork-lg]
  needs: []
  timeout: 10 minutes
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  retry: 1
  before_script:
    - apt-get update 1> /dev/null
    - apt-get install -y python3-pip 1> /dev/null
    - pip3 install slither-analyzer 1> /dev/null
    - corepack enable
    - pnpm install --frozen-lockfile
    - rm -f ./slither.json ./slither_badge.json
  script:
    - (slither . --json=./slither.json || if [ $? = 1 ]; then exit 1; else exit 0; fi)
    - node scripts/slither-parse.js ./slither.json
  artifacts:
    when: always
    expire_in: 7 days
    paths: [slither.json]

test-unit-hardhat:
  extends:
    - .test
  script:
    - pnpm hardhat test --network hardhat ${TEST_ARG}
  parallel:
    matrix:
      - TEST_ARG:
          - ./test/unit/protocol/coding/coding.test.ts
          - ./test/unit/protocol/implementation/RewardManager.test.ts
          - ./test/unit/protocol/implementation/Submission.test.ts
          - ./test/unit/fastUpdates/lib/Bn256.test.ts
          - ./test/unit/fastUpdates/lib/FixedPointArithmetic.test.ts
          - ./test/unit/fastUpdates/lib/Sortition.test.ts

test-unit-hardhat-md:
  extends:
    - .test
  timeout: 10 minutes
  tags: [flarenetwork-md]
  script:
    - pnpm hardhat test --network hardhat ${TEST_ARG}
  parallel:
    matrix:
      - TEST_ARG:
          - ./test/unit/protocol/implementation/Relay.test.ts
          - ./test/unit/fastUpdates/implementation/FastUpdateIncentiveManager.test.ts
          - ./test/unit/fastUpdates/implementation/FastUpdater.test.ts

test-contract-end-to-end:
  extends:
    - .test
  tags: [flarenetwork-lg]
  script:
    - pnpm hardhat test ./test/integration/EndToEnd.test.ts

test-linter-sol:
  extends:
    - .test
  script:
    - pnpm lint-sol

test-linter-ts:
  extends:
    - .test
  script:
    - pnpm lint:check

test-format:
  extends:
    - .test
  script:
    - pnpm format:check

test-unit-forge:
  extends:
    - .test
  timeout: 10 minutes
  tags: [flarenetwork-lg]
  image: !reference [.partials, foundry-image]
  before_script:
    - forge soldeer install
    - forge install --no-git
    - forge build
  script:
    - forge test -vvv

##
## COVERAGE
##

coverage-hardhat:
  image: node:24
  stage: test
  extends:
    - .pnpm-cache
  needs: []
  timeout: 30 minutes
  tags: [flarenetwork-lg-cpu] # 16gb RAM
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm run coverage
    - cp coverage/cobertura-coverage.xml coverage-hardhat-cobertura.xml
  artifacts:
    name: coverage-hardhat
    when: always
    expire_in: 1 month
    paths:
      - ./coverage/
      - ./coverage.json
      - coverage-hardhat-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml


coverage-forge-node_modules:
  image: node:24
  stage: test
  extends:
    - .pnpm-cache
  needs: []
  timeout: 7 minutes
  tags: [flarenetwork-lg]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -y && apt-get install -y rsync
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - rsync -zarvm --include "*/" --include="*.sol" --include="*.js" --include="*.cjs" --include="*.mjs" --include="*.json" --exclude="*" node_modules/ node_modules.sol
  artifacts:
    expire_in: 5 minutes
    paths:
      - node_modules.sol

coverage-forge:
  image: !reference [.partials, foundry-image]
  stage: test
  needs:
    - job: coverage-forge-node_modules
      artifacts: true
  tags: [flarenetwork-lg]
  timeout: 10 minutes
  before_script:
    - mv node_modules.sol node_modules
    - forge soldeer install
    - forge install --no-git
    - forge build
  script:
    # The three skipped contracts hit "stack too deep" under coverage, which forces viaIR off. The
    # four skipped suites import those contracts directly, so they cannot compile once the contracts
    # are gone. All of it is measured by coverage-forge-viair instead, and still runs in
    # test-unit-forge either way.
    - >
      FOUNDRY_PROFILE=coverage forge coverage --report summary --report lcov
      --skip 'contracts/tee/implementation/TeePayments.sol'
      --skip 'contracts/tee/implementation/TeePaymentsUtxo.sol'
      --skip 'contracts/protocol/implementation/NodePossessionVerifier.sol'
      --skip 'test-forge/unit/tee/implementation/TeePayments.t.sol'
      --skip 'test-forge/unit/tee/implementation/TeePaymentsUtxo.t.sol'
      --skip 'test-forge/integration/WalletPayments.t.sol'
      --skip 'test-forge/unit/protocol/implementation/NodePossessionVerifier.t.sol'
  artifacts:
    expire_in: 30 days
    paths:
      - lcov.info

coverage-forge-viair:
  # Covers the three contracts coverage-forge must skip. Everything is pinned to viaIR here, so
  # contracts/mock (legacy pragmas) and contracts/rNat (Yul stack issues) drop out along with the
  # suites importing them - coverage-forge measures those. The two reports are merged downstream.
  image: !reference [.partials, foundry-image]
  stage: test
  needs:
    - job: coverage-forge-node_modules
      artifacts: true
  tags: [flarenetwork-lg]
  timeout: 10 minutes
  before_script:
    - mv node_modules.sol node_modules
    - forge soldeer install
    - forge install --no-git
  script:
    # contracts/mock (legacy 0.6.12/0.7.6 pragmas, where viaIR does not exist) and contracts/rNat
    # (Yul stack issues) cannot be compiled under the blanket viaIR pinning, so they and their
    # suites are skipped. The remaining test skips are scope, not necessity: this pass exists to
    # measure the three contracts coverage-forge cannot, and everything else it would report is
    # already covered there. test-forge/unit/protocol is deliberately NOT skipped - that is where
    # NodePossessionVerifier.t.sol lives, and it is one of those three.
    - >
      FOUNDRY_PROFILE=coverage-viair forge coverage --report lcov --report-file lcov-viair.info
      --skip '**/contracts/mock/**'
      --skip '**/contracts/rNat/**'
      --skip '**/test-forge/unit/rNat/**'
      --skip '**/test-forge/unit/ftso/**'
      --skip '**/test-forge/unit/fscV1/**'
      --skip '**/test-forge/unit/fdc/**'
      --skip '**/test-forge/unit/fastUpdates/**'
      --skip '**/test-forge/unit/governance/**'
      --skip '**/test-forge/unit/staking/**'
      --skip '**/test-forge/unit/customFeeds/**'
      --skip '**/test-forge/unit/adapters/**'
      --skip '**/test-forge/unit/utils/**'
      --skip '**/test-forge/integration/PollingFoundation.t.sol'
  artifacts:
    expire_in: 30 days
    paths:
      - lcov-viair.info

coverage-forge-reports:
  image: node:24-alpine
  stage: test
  timeout: 5 minutes
  needs:
    - job: coverage-forge
      artifacts: true
    - job: coverage-forge-viair
      artifacts: true
  before_script:
    - echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
    - echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
    - echo "https://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
    - apk add --no-cache python3 py3-pip lcov 1>/dev/null
    - apk upgrade --no-cache 1>/dev/null
    - pip3 install --break-system-packages lcov_cobertura 1>/dev/null
  script:
    # Neither pass sees the whole tree on its own - each measures what the other has to skip - so the
    # reported figure is their union. The two agree line-for-line on every file they share, so `-a`
    # only ever adds files or turns an unhit line into a hit one.
    # --rc branch_coverage=1 is required on the merge itself: without it `lcov -a` silently drops
    # every BRDA record, and the genhtml/summary steps below then report no branch data at all.
    - lcov -a lcov.info -a lcov-viair.info -o lcov-merged.info --rc branch_coverage=1 --ignore-errors inconsistent
    - mv lcov-merged.info lcov.info
    - node scripts/forge-lcov-prune.js
    - genhtml lcov.info.pruned --branch-coverage --output-dir coverage-forge --ignore-errors inconsistent
    - lcov_cobertura lcov.info.pruned --output coverage-forge-cobertura.xml
    - lcov --summary lcov.info.pruned --rc branch_coverage=1 --ignore-errors inconsistent
  coverage: '/  lines[\ .:]+\d+\.\d+%/' # https://regex101.com/r/KVj9Dr/1
  artifacts:
    expire_in: 30 days
    paths:
      - lcov.info.pruned
      - coverage-forge
      - coverage-forge-cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-forge-cobertura.xml

{
  "files": [
    "certora/harness/RelayHarness.sol"
  ],
  "verify": "RelayHarness:certora/specs/RelayWriteOnce.spec",
  "solc": "solc0.8.35",
  "solc_via_ir": true,
  "solc_optimize": "200",
  "solc_evm_version": "cancun",
  "packages": [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
    "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.7.0/",
    "@flarenetwork/flare-periphery-contracts/flare/=dependencies/flare-periphery-0.1.38/src/flare/"
  ],
  "loop_iter": "3",
  "optimistic_loop": true,
  "optimistic_hashing": true,
  "hashing_length_bound": "512",
  "rule_sanity": "basic",
  "wait_for_results": "all",
  "prover_args": [
    "-enableStorageSplitting false"
  ],
  "rule": [
    "policyHashWriteOnce",
    "merkleRootWriteOnce",
    "feeTableMappingSetLockstepPreserved",
    "reservedProtocolFeesRemainUnset",
    "immediateSetterModeProtocolFeeUpdateReverts",
    "immediateProtocolFeeUpdateCanApply",
    "tokenModeRejectsNativeValueBeforeExternalCall",
    "tokenModeUnfinalizedVerificationDoesNotCallToken",
    "tokenModeInvalidEmptyProofDoesNotCallToken",
    "tokenModeValidEmptyProofCallsConfiguredToken",
    "oldRelayDelegationForwardsNoValueAndRefundsOnSuccess",
    "onlyOwnerCanEnterGuardedSurface",
    "delayedOwnerCallDoesNotApply",
    "successfulExecutionConsumesQueue",
    "successfulNonUpgradeExecutionPreservesRelayInvariants",
    "successfulDurationUpdateIsBounded",
    "ownershipRenounceAlwaysReverts",
    "ownershipTransferPreservesQueuedCall"
  ],
  "msg": "Relay current implementation: write-once, fee-token, and governance transition rules"
}
